<!--
  BRA-0001 — Primary Logo Master — Icon Only, Dark Version
  DRAFT v0.3 — CONCEPT REFINEMENT PASS — NOT APPROVED — NOT THE FINAL LOCKED ASSET
  Still Concept 5, "Weighted Line" (mass + a fracture that escapes it) — not a new concept.
  Refines the mass silhouette from v0.1/v0.2's abstract two-block shape into a recognizable
  stylized anvil (horn, flat face, tapered waist, flared base), built from four straight-edged
  polygons unioned into one silhouette. Fracture uses the v0.2 knockout-gap + tapering-shard
  technique, recomputed for this new geometry (entry (42,26), kink (46,50), exit on the base's
  right edge ~(72.66,66.66), one deflection from ~80.5° to 32°).
  Colors are the Brand Bible's Locked values (Void Black #0A0B0D, Authority White #F5F7FA,
  Fracture Cyan #00E5FF) — this draft was informed by a founder-provided concept board for
  creative direction only; it was not traced, and that board's swatches ("Deep Forge" #0B0F14,
  "Mythic White" #FFFFFF) do not match the Locked palette and were not used.
-->
