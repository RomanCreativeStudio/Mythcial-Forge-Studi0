<!--
  BRA-0001 — Primary Logo Master — Icon Only, Dark Version
  DRAFT v0.11 — SECOND REFERENCE, DOUBLE-HORN GEOMETRY — NOT YET MARKED APPROVED
  Traces a newly submitted, explicitly "approved" concept reference image (a single
  clean render, distinct from the earlier multi-panel photorealistic board used for
  v0.10) into pure flat vector, per instruction: "the reference image is now the
  source of truth... match the reference image's geometry... ignore the
  photorealistic rendering effects." Geometry only was traced — no gradients,
  lighting, smoke, or reflections. Silhouette is a double-horned anvil (horns to
  both left and right, unlike v0.9/v0.10's single curved horn), with a two-footed
  base (twin rectangular feet with a true negative-space gap between them, unlike
  v0.9/v0.10's rounded arch cutout or angular base). Fracture is a jagged 5-segment
  path originating at a shallow notch at the top center and running down through the
  waist into the base plate, built with the same knocked-out-gap fill-rule="evenodd"
  technique used throughout this project; every segment verified by ray-segment
  intersection against the mass boundary before construction. Shard is a single solid
  quadrilateral floating above the top notch (not falling from the base, unlike
  v0.9/v0.10), with the same steel-fill-plus-cyan-hot-edge treatment. Horns and feet
  are built as separate simple polygons deliberately overlapping the main mass path
  (multi-shape-union technique), not one single error-prone boundary walk. Zero
  gradients, filters, blurs, or shadows — grep-verified. This is a third candidate
  alongside v0.9 and v0.10, not a merge of either — see the v0.11 Review Package for
  the full comparison, including a measured, more severe circular-crop clipping
  finding than prior versions, caused by this silhouette's much wider aspect ratio.
-->
