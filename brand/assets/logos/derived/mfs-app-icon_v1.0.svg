<!--
  BRA-0001 — Derived Asset — App Icon Master (1024x1024)
  STATUS: APPROVED AND LOCKED — 2026-07-08
  Per Brand Bible Section 14 ("App Icons: 1024x1024 master, Icon Version, cropped
  per each platform's own icon-shape guidelines"). Uses the same safe-padding
  approach as mfs-logo-avatar_v1.0.svg (icon scaled to clear a 72%-radius safe
  circle from its own true bounding-box center) since app-icon shape masks (iOS
  rounded square, Android adaptive circle/squircle, etc.) carry the same clipping
  risk as YouTube's circular avatar crop. This is the master only; per-platform
  masked exports (iOS corner radius, Android adaptive icon layers) are a future
  platform-specific step, not guessed at here.
-->
