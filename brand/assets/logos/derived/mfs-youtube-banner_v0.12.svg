<?xml version="1.0" encoding="UTF-8"?>
<!--
  BRA-0001 — Derived Asset — YouTube Channel Banner (2560x1440)
  DRAFT — flat-vector composition only, NOT a recreation of the submitted reference
  banner's photographic/cinematic background. That reference shows a dark cinematic
  fantasy environment with atmospheric lighting and smoke; this environment has no
  image-generation or photo-compositing tool available, so that background cannot be
  produced here. What IS matched: the reference's stacked composition (icon centered
  above the wordmark, STUDIOS with flanking rules below that, tagline in Fracture
  Cyan below that) and its placement within YouTube's actual cross-device safe area
  (1546x423 centered in the 2560x1440 canvas) — verified by rendering the full
  banner and overlaying the true safe-area rectangle: all text sits inside it with
  margin, only the shard's tip brushes the boundary, an acceptable graphic-element
  overflow (unlike text, which must not be clipped). Background is flat Void Black
  (#0A0B0D), same as every other flat-vector asset in this project — if a
  photographic/atmospheric banner is required, it needs either an external
  image-generation tool or the Founder's actual photo asset to composite onto,
  neither of which exists in this environment.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440">
  <rect x="0" y="0" width="2560" height="1440" fill="#0A0B0D"/>

  <!-- icon, centered above the wordmark stack, within/near the cross-device safe area -->
  <g transform="translate(1111.15,424.33) scale(3.377)">
    <path d="M2,41 L33,27 L42,35 L28,48 Z" fill="#F5F7FA"/>
    <path d="M98,41 L67,27 L58,35 L72,48 Z" fill="#F5F7FA"/>
    <path d="M18,84 L38,84 L38,92 L18,92 Z" fill="#F5F7FA"/>
    <path d="M62,84 L82,84 L82,92 L62,92 Z" fill="#F5F7FA"/>
    <path d="M36,28 L47,28 L50,32 L53,28 L64,28 L69,43 L58,60 L74,75 L74,84 L26,84 L26,75 L42,60 L31,43 Z M49.17,32.45 L42.42,42.25 L51.81,50.24 L43.21,59.81 L48.65,70.58 L46.08,79.22 L53.92,80.78 L55.35,69.42 L48.79,60.19 L56.19,49.76 L45.58,41.75 L50.83,33.55 Z" fill="#F5F7FA" fill-rule="evenodd"/>
    <path d="M48,18 L58,15 L62,22 L54,27 Z" fill="#F5F7FA"/>
    <path d="M48,18 L51,19.5 L54,27 L50,24 Z" fill="#00E5FF"/>
  </g>

  <!-- wordmark stack, centered in the YouTube cross-device safe area (1546x423 centered at 1280,720) -->
  <text x="1280" y="805" text-anchor="middle" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="92" font-weight="700" letter-spacing="0" fill="#F5F7FA">MYTHIC FORGE</text>
  <text x="1280" y="860" text-anchor="middle" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="42" font-weight="400" letter-spacing="10" fill="#F5F7FA">STUDIOS</text>
  <line x1="1030" y1="850" x2="1140" y2="850" stroke="#F5F7FA" stroke-width="2"/>
  <line x1="1420" y1="850" x2="1530" y2="850" stroke="#F5F7FA" stroke-width="2"/>
  <text x="1280" y="910" text-anchor="middle" font-family="'Space Grotesk', system-ui, -apple-system, 'Segoe UI', Arial, sans-serif" font-size="26" font-weight="400" letter-spacing="4" fill="#00E5FF">FORGING WORLDS. CREATING LEGENDS.</text>

  <!-- safe-area guide (comment-only reference, not part of the visible design) -->
</svg>
