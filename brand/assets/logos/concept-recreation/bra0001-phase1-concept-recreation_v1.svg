<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620">
  <defs>
    <linearGradient id="steel" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#f0f2f4"/>
      <stop offset="16%" stop-color="#9ca3aa"/>
      <stop offset="34%" stop-color="#f5f7f8"/>
      <stop offset="52%" stop-color="#8a9096"/>
      <stop offset="70%" stop-color="#d2d6da"/>
      <stop offset="100%" stop-color="#5c6167"/>
    </linearGradient>
    <linearGradient id="steelShard" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f9fafb"/>
      <stop offset="50%" stop-color="#c4c9cd"/>
      <stop offset="100%" stop-color="#767b80"/>
    </linearGradient>
    <linearGradient id="wordmarkGrad" x1="0%" y1="0%" x2="100%" y2="20%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#d3d9dd"/>
      <stop offset="55%" stop-color="#f5f6f8"/>
      <stop offset="100%" stop-color="#969ba0"/>
    </linearGradient>
    <radialGradient id="ambientGlow" cx="55%" cy="55%" r="55%">
      <stop offset="0%" stop-color="#00E5FF" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#00E5FF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="glowSoft" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
    <filter id="glowMed" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
    <filter id="glowTight" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="1.6"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="900" height="620" fill="#0a0a0b"/>
  <rect x="0" y="0" width="900" height="620" fill="url(#ambientGlow)"/>

  <!-- ICON -->
  <g transform="translate(120,15) scale(5.3)">
    <!-- wide ambient glow behind the whole crack, bleeding well past the metal -->
    <path d="M47.94,26.97 L40.85,40.59 L51.07,50.73 L45.31,61.03 L66.13,80.84 L73.87,71.16 L54.69,58.97 L58.93,49.27 L47.15,39.41 L52.06,29.03 Z"
          fill="#00E5FF" opacity="0.85" filter="url(#glowSoft)"/>

    <!-- steel mass with true knocked-out fracture gap (evenodd) -->
    <path d="M8,42 C12,34 18,29 27,27 L79,27 L79,43 L71,56 L83,73 L81,77 L58,77 C58,68 42,68 42,77 L23,77 L21,73 L33,56 C25,54 15,50 8,42 Z M47.94,26.97 L40.85,40.59 L51.07,50.73 L45.31,61.03 L66.13,80.84 L73.87,71.16 L54.69,58.97 L58.93,49.27 L47.15,39.41 L52.06,29.03 Z"
          fill="url(#steel)" fill-rule="evenodd" stroke="#2f353a" stroke-width="0.25"/>

    <!-- glow bleeding onto the metal surface immediately around the gap -->
    <path d="M47.94,26.97 L40.85,40.59 L51.07,50.73 L45.31,61.03 L66.13,80.84 L73.87,71.16 L54.69,58.97 L58.93,49.27 L47.15,39.41 L52.06,29.03 Z"
          fill="#5df4ff" opacity="0.9" filter="url(#glowMed)"/>

    <!-- the gap itself, filled bright cyan (the "energy" reading through the void) -->
    <path d="M47.94,26.97 L40.85,40.59 L51.07,50.73 L45.31,61.03 L66.13,80.84 L73.87,71.16 L54.69,58.97 L58.93,49.27 L47.15,39.41 L52.06,29.03 Z"
          fill="#00E5FF"/>

    <!-- bright hot core line down the middle -->
    <path d="M50,28 L44,40 L55,50 L50,60 L70,76" fill="none" stroke="#c9feff" stroke-width="1.3" stroke-linejoin="round" stroke-linecap="round" filter="url(#glowTight)"/>
    <path d="M50,28 L44,40 L55,50 L50,60 L70,76" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-linejoin="round" stroke-linecap="round"/>

    <!-- detached shard, large and clearly separated -->
    <g filter="url(#glowSoft)" opacity="0.65">
      <path d="M70.15,82.43 L72.57,88.96 L70.7,95.92 L79.96,85.25 Z" fill="#00E5FF"/>
    </g>
    <path d="M70.15,82.43 L72.57,88.96 L70.7,95.92 L79.96,85.25 Z" fill="url(#steelShard)" stroke="#2f353a" stroke-width="0.22"/>
    <path d="M70.15,82.43 L71.39,85.2 L77.67,87.8 L79.96,85.25 Z" fill="#00E5FF"/>

    <!-- small floating debris chips, clearly separated from the shard -->
    <g filter="url(#glowMed)" opacity="0.55">
      <path d="M84,68 L86.5,69.3 L85,72 Z" fill="#00E5FF"/>
      <path d="M88,79 L90,80.5 L88.7,83 Z" fill="#00E5FF"/>
    </g>
    <path d="M84,68 L86.5,69.3 L85,72 Z" fill="url(#steelShard)" stroke="#2f353a" stroke-width="0.15"/>
    <path d="M88,79 L90,80.5 L88.7,83 Z" fill="url(#steelShard)" stroke="#2f353a" stroke-width="0.15"/>
  </g>

  <!-- WORDMARK -->
  <g transform="translate(450,548) skewX(-8) translate(-450,-548)">
    <text x="450" y="548" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="78" font-weight="900" letter-spacing="1" fill="url(#wordmarkGrad)">MYTHIC FORGE</text>
  </g>
  <text x="450" y="592" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="600" letter-spacing="9" fill="#e2e8eb">STUDIOS</text>
  <line x1="322" y1="585" x2="392" y2="585" stroke="#00E5FF" stroke-width="1.8" filter="url(#glowTight)"/>
  <line x1="508" y1="585" x2="578" y2="585" stroke="#00E5FF" stroke-width="1.8" filter="url(#glowTight)"/>
  <text x="450" y="616" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" letter-spacing="3.5" fill="#8b949c">FORGING WORLDS. CREATING LEGENDS.</text>
</svg>
